# Development compose file — builds images from source.
# Used by: just dev, just build, just test
# For production (pre-built GHCR images), use: just up  (docker-compose.prod.yml)
services:
  # ── Docker exec shim ───────────────────────────────────────────────────────
  # Custom Python HTTP proxy that allows ONLY the Docker API calls required
  # for `docker exec` against the hardcoded ferret-lab container:
  #   POST /containers/ferret-lab/exec   — exec-create
  #   POST /exec/<id>/start              — exec-start  (handles hijacked streams)
  #   POST /exec/<id>/resize             — exec-resize
  #   GET  /exec/<id>/json               — exec-inspect
  # Everything else — including POST /containers/create (the RCE vector) and
  # GET /containers/json — is blocked with HTTP 403.
  # The allowed container name is configurable via ALLOWED_CONTAINER env var.
  docker-shim:
    build:
      context: src/apps/docker-shim
      dockerfile: Dockerfile
    image: ferret-docker-shim:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FERRET_DATA_DIR:-./data}:/data
    networks:
      - docker-internal
    restart: unless-stopped

  api:
    build:
      context: src/apps/api
      dockerfile: Dockerfile
    image: ferret-api:latest
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    ports:
      - "8000:8000"
      - "127.0.0.1:1337:1337"
    environment:
      PROXY_HOST: ${PROXY_HOST:-127.0.0.1}
      PROXY_PORT: ${PROXY_PORT:-1337}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3-flash-preview}
      FERRET_TESTS_DIR: /data/tests
      FERRET_WORKSPACES_DIR: /data/workspaces
      FERRET_SANDBOX_CONTAINER: ferret-runner
      # Route Docker CLI calls through the exec shim instead of the raw socket.
      DOCKER_HOST: tcp://docker-shim:2375
      # Use stat()-based polling instead of inotify so watchfiles detects changes
      # on Docker bind mounts where host inotify events are not propagated into
      # the container (common on Linux with overlayfs).
      WATCHFILES_FORCE_POLLING: "true"
      FERRET_RUNNER_IMAGE: ${FERRET_RUNNER_IMAGE:-ghcr.io/synlace/ferret-runner:bec8cb721967e19f33a8fb2f8b60804c70930509}
    volumes:
      - ${FERRET_DATA_DIR:-./data}:/data
      # Mount source over the built image so Python changes are picked up
      # without rebuilding. watchfiles (below) auto-restarts uvicorn on change.
      - ./src/apps/api:/app
    # Use watchfiles to restart uvicorn when source files change.
    # WATCHFILES_FORCE_POLLING=true uses stat() instead of inotify so it works
    # reliably across Docker bind mounts where the host does not propagate inotify
    # events into the container (the common case on Linux with overlayfs/bind mounts).
    # This avoids the --reload fork that breaks Docker port mapping.
    # NOTE: watchfiles CLI signature is `watchfiles <target-command> <paths...>`.
    # The target command must come first; --ignore-paths takes directory names
    # to ignore (e.g. __pycache__), not the target command.
    command:
      - python
      - -m
      - watchfiles
      - --ignore-paths
      - "__pycache__,.pytest_cache"
      - "python -m uvicorn main:app --host 0.0.0.0 --port 8000 --ws websockets"
      - /app
    networks:
      - default
      - docker-internal
    # Allow the api container to reach local AI providers (Ollama, LM Studio)
    # running on the host machine.  Docker resolves "host-gateway" to the host's
    # gateway IP automatically — no hardcoded IPs required.
    extra_hosts:
      - "host-gateway:host-gateway"
    depends_on:
      - docker-shim
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  ui:
    build:
      context: src/apps/ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SIGINT_URL: ${NEXT_PUBLIC_SIGINT_URL:-}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
    image: ferret-ui:latest
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  runner:
    # Pre-built image is published to GHCR by .github/workflows/publish-runner.yml.
    # To build locally instead (e.g. when modifying the runner image), set:
    #   FERRET_RUNNER_IMAGE_LOCAL=ferret-runner:local in .env, then run: just build-runner
    image: ${FERRET_RUNNER_IMAGE_LOCAL:-ghcr.io/synlace/ferret-runner:latest}
    container_name: ferret-runner
    volumes:
      - ${FERRET_DATA_DIR:-./data}/workspaces:/data/workspaces
      - ${FERRET_DATA_DIR:-./data}/workspaces:/workspaces
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    # Allow scripts running inside the runner sandbox to reach local AI providers
    # on the host machine via the same host-gateway hostname.
    extra_hosts:
      - "host-gateway:host-gateway"
    restart: unless-stopped
    depends_on:
      - api

# No named volumes — data is bind-mounted to ${FERRET_DATA_DIR:-./data} on the host.
# This makes ./data/tests, ./data/mitmproxy, ./data/workspaces, etc. directly accessible for editing.
# The runner container also gets ./data/workspaces mounted at /workspaces so scripts/tests
# written by the AI are accessible at the same path the API uses when building docker exec commands.

networks:
  default: {}
  docker-internal:
    internal: true
