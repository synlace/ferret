name: Publish release images

# Builds and pushes ferret-api, ferret-ui, and ferret-docker-shim to GHCR.
# Triggered on version tags (e.g. v1.2.3) and manual dispatch.
# Images are tagged :latest and :<version>.
#
# After this workflow completes, `just up` will pull the new images.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # ── ferret-api ──────────────────────────────────────────────────────────
      - name: Build and push ferret-api
        uses: docker/build-push-action@v5
        with:
          context: src/apps/api
          file: src/apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/ferret-api:latest
            ghcr.io/${{ github.repository_owner }}/ferret-api:${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ferret-api:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ferret-api:cache,mode=max

      # ── ferret-ui ───────────────────────────────────────────────────────────
      # NEXT_PUBLIC_API_URL defaults to http://localhost:8000 — the standard
      # local setup. Users who run the API on a different host/port can override
      # NEXT_PUBLIC_API_URL in their .env before running `just up`.
      - name: Build and push ferret-ui
        uses: docker/build-push-action@v5
        with:
          context: src/apps/ui
          file: src/apps/ui/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ferret-ui:latest
            ghcr.io/${{ github.repository_owner }}/ferret-ui:${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ferret-ui:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ferret-ui:cache,mode=max

      # ── ferret-docker-shim ──────────────────────────────────────────────────
      - name: Build and push ferret-docker-shim
        uses: docker/build-push-action@v5
        with:
          context: src/apps/docker-shim
          file: src/apps/docker-shim/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/ferret-docker-shim:latest
            ghcr.io/${{ github.repository_owner }}/ferret-docker-shim:${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ferret-docker-shim:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ferret-docker-shim:cache,mode=max
