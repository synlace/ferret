name: Secret Scanning (TruffleHog)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history is required for commit scans

      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog-enterprise-github-action@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --exclude-paths=security/trufflehog-exclude.txt
