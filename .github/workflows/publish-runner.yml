name: Publish ferret-runner image

on:
  push:
    branches:
      - main
    paths:
      - 'src/apps/runner/**'
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Log in to AWS Public Elastic Container Registry (ECR)
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        run: |
          GH_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          AWS_LOGGED_IN="${{ steps.login-ecr-public.outputs.registry }}"
          AWS_ALIAS="${{ secrets.AWS_ECR_PUBLIC_ALIAS || 'synlace' }}"
          AWS_REGISTRY="public.ecr.aws/${AWS_ALIAS}"
          
          # Initialize standard GHCR tags
          TAGS="ghcr.io/${GH_OWNER}/ferret-runner:latest"
          TAGS="${TAGS},ghcr.io/${GH_OWNER}/ferret-runner:${{ github.sha }}"
          
          # Add AWS ECR Public tags ONLY if the ECR login step succeeded
          if [ -n "${AWS_LOGGED_IN}" ]; then
            TAGS="${TAGS},${AWS_REGISTRY}/ferret-runner:latest"
            TAGS="${TAGS},${AWS_REGISTRY}/ferret-runner:${{ github.sha }}"
          fi
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="${TAGS},ghcr.io/${GH_OWNER}/ferret-runner:${VERSION}"
            if [ -n "${AWS_LOGGED_IN}" ]; then
              TAGS="${TAGS},${AWS_REGISTRY}/ferret-runner:${VERSION}"
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push ferret-runner
        uses: docker/build-push-action@v5
        with:
          context: src/apps/runner
          file: src/apps/runner/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ferret-runner:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ferret-runner:cache,mode=max
