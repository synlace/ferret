name: Publish ferret-runner image

on:
  push:
    branches:
      - main
    paths:
      - 'src/apps/runner/**'
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ferret-github-actions-role
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}
          audience: sts.amazonaws.com

      - name: Log in to AWS Elastic Container Registry (ECR)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        run: |
          GH_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          AWS_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          
          # Dual-publish tags (GHCR + ECR)
          TAGS="ghcr.io/${GH_OWNER}/ferret-runner:latest"
          TAGS="${TAGS},${AWS_REGISTRY}/ferret-runner:latest"
          TAGS="${TAGS},ghcr.io/${GH_OWNER}/ferret-runner:${{ github.sha }}"
          TAGS="${TAGS},${AWS_REGISTRY}/ferret-runner:${{ github.sha }}"
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="${TAGS},ghcr.io/${GH_OWNER}/ferret-runner:${VERSION}"
            TAGS="${TAGS},${AWS_REGISTRY}/ferret-runner:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push ferret-runner
        uses: docker/build-push-action@v5
        with:
          context: src/apps/runner
          file: src/apps/runner/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ferret-runner:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ferret-runner:cache,mode=max
